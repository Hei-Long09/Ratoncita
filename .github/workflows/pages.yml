name: Publicar página de cumpleaños

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener los archivos
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar el código
        run: npm run check
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar la carpeta pública
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar la página
        id: deployment
        uses: actions/deploy-pages@v4
